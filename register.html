<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Nexbyte Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">&lt;/&gt;</span>
      <span class="brand-name">NEXBYTE</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Log in</a>
    </nav>
  </div>
</header>

<section class="auth-section">
  <div class="auth-card">
    <p class="eyebrow">New here?</p>
    <h2>Create a customer account</h2>
    <p class="auth-sub">New accounts are created as Customer by default. Admin accounts are set up separately for security.</p>

    <form class="auth-form" id="register-form">
      <label>
        Full name
        <input type="text" id="register-name" placeholder="Your name" required>
      </label>
      <label>
        Email
        <input type="email" id="register-email" placeholder="you@example.com" required>
      </label>
      <label>
        Password
        <input type="password" id="register-password" placeholder="At least 6 characters" required minlength="6">
      </label>
      <p class="auth-error" id="auth-error"></p>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
  document.getElementById("register-form").addEventListener("submit", function (e) {
    e.preventDefault();
    const name = document.getElementById("register-name").value;
    const email = document.getElementById("register-email").value;
    const password = document.getElementById("register-password").value;
    registerUser(name, email, password);
  });
</script>

</body>
</html>
